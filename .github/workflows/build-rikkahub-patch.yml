name: build-rikkahub-patch

# 外挂验证 lane：对 xiwangone/rikkahub-agents 的某个 base 打一个存放在本仓
# patch 分支里的 patch，跑编译 + 单测。不碰 rikkahub-agents 本仓
# （只读 clone + runner 本地打 patch），结果用 gh 拉回来看。
#
# 两种触发方式：
#   1. 手动 dispatch（需要 token 有 Actions:write 权限）：
#      gh workflow run build-rikkahub-patch.yml --repo xiwangone/agent-devkit --ref main \
#        -f base_sha=<sha> -f patch_ref=<分支> -f patch_path=<分支内路径>
#   2. 推 patch 分支（不用 token，推完就跑；各输入取默认值，
#      patch_ref 取当前分支名）：
#      git push origin patch/<名字>
#
# 注意：
# - runner 是 4 核 16G / 14G 盘的标准免费 runner；Gradle 缓存
#   （modules-2 / build-cache-1）按本仓单独存，首跑是冷的，跑几轮后热起来。
# - inputs 上下文不能用在 uses: 行（GitHub 启动时直接拒掉整个 run，
#   0 个 job、没日志），所以 uses: 行一律用 github.event.inputs.X || 默认值。

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: "rikkahub-agents base commit"
        required: true
        default: "14fc3a17099d91ff07a00c144731c4a4427af7bb"
      patch_ref:
        description: "本仓里放 patch 的分支"
        required: true
        default: "patch/stale-tests-14fc3a170"
      patch_path:
        description: "分支里 patch 文件的路径"
        required: true
        default: "patches/stale-tests-14fc3a170.patch"
      gradle_tasks:
        description: "要跑的 Gradle 任务"
        required: false
        default: ":app:compileDebugKotlin :app:testDebugUnitTest :workspace:testDebugUnitTest"
  push:
    branches:
      - "patch/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      _JAVA_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      BASE_SHA: ${{ github.event.inputs.base_sha || '14fc3a17099d91ff07a00c144731c4a4427af7bb' }}
      PATCH_REF: ${{ github.event.inputs.patch_ref || github.ref_name }}
      # 注意：dispatch 时 inputs.patch_path 取不到值会用声明的默认值；
      # push 触发时 inputs 整个为空，这里故意不写 || 默认值，
      # 由下面“打 patch”一步按分支名推导（patch/<名> → patches/<名>.patch）。
      PATCH_PATH: ${{ github.event.inputs.patch_path }}
      GRADLE_TASKS: ${{ github.event.inputs.gradle_tasks || ':app:compileDebugKotlin :app:testDebugUnitTest :workspace:testDebugUnitTest' }}
    steps:
      - name: 解析 base 为完整 SHA
        id: resolve-base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # actions/checkout 把短 SHA 当分支名处理（refs/heads/<短 SHA>），
          # fetch 不到就挂；先调 API 解析成完整 SHA 再 checkout。
          FULL_SHA=$(gh api "repos/xiwangone/rikkahub-agents/commits/${BASE_SHA}" --jq '.sha')
          if [ -z "$FULL_SHA" ]; then echo "base $BASE_SHA 解析失败"; exit 1; fi
          echo "sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "base: $BASE_SHA -> $FULL_SHA"

      - name: 取 rikkahub-agents（base，工作区根目录）
        uses: actions/checkout@v4
        with:
          repository: xiwangone/rikkahub-agents
          ref: ${{ steps.resolve-base.outputs.sha }}
          fetch-depth: 1
          submodules: true

      - name: 取本仓 patch 分支
        uses: actions/checkout@v4
        with:
          repository: xiwangone/agent-devkit
          ref: ${{ env.PATCH_REF }}
          path: patch-src
          fetch-depth: 1

      - name: 打 patch（先 --check）
        run: |
          set -e
          # push 触发时 inputs 为空，按分支名推导：patch/<名> → patches/<名>.patch
          if [ -z "$PATCH_PATH" ]; then PATCH_PATH="patches/${GITHUB_REF_NAME#patch/}.patch"; fi
          echo "base=$BASE_SHA patch_ref=$PATCH_REF patch_path=$PATCH_PATH"
          git apply --check "patch-src/${PATCH_PATH}"
          git apply "patch-src/${PATCH_PATH}"
          echo "--- 改动规模 ---"
          git diff --stat | tail -3

      # 注意：steps[*].uses 里任何上下文都不可用（连 github 都不行），
      # action ref 只能写死字面值。这里 pin 到当前 base 的 SHA；
      # setup-build-env 只是装 JDK/SDK 的环境动作，变化极少，
      # 换 base 时如它改了再手动 bump 这个 SHA。
      - name: 准备构建环境（复用本仓 setup-build-env）
        uses: xiwangone/rikkahub-agents/.github/actions/setup-build-env@14fc3a17099d91ff07a00c144731c4a4427af7bb

      - name: 缓存 Gradle 发行版
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-dist-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-dist-

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-
          save-always: true

      - name: 磁盘用量（跑前）
        run: df -h .

      - name: 编译 + 单测
        # 必须加 pipefail：没有它，`./gradlew ... | tee 日志` 的退出码是 tee 的 0，
        # Gradle 失败也会被吞成 job 成功（2026-11-13 首跑实测：BUILD FAILED 却报 success）。
        run: |
          set -o pipefail
          ./gradlew ${GRADLE_TASKS} --no-daemon --no-configuration-cache -x :web:buildWebUi -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 2>&1 | tee gradle-verify.log

      - name: 磁盘用量（跑后）
        if: always()
        run: df -h .

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            gradle-verify.log
          if-no-files-found: ignore
