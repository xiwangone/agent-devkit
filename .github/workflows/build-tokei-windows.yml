name: build-tokei-windows
# 编 tokei Windows 版（官方无预编译，PC 用）
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Checkout tokei
        uses: actions/checkout@v4
        with:
          repository: XAMPPRocky/tokei
          ref: v12.1.2
      - name: Build release
        run: cargo build --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokei-windows
          path: target/release/tokei.exe
          retention-days: 30
