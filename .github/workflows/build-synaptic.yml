name: build-synaptic
# CI 构建 Synaptic 二进制（x86_64 + aarch64 交叉编译，仅手动触发，产物上传 artifact）
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ColinVaughn/Synaptic
          ref: master
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add targets + linker
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build release (x86_64)
        run: cargo build --release
      - name: Build release (aarch64 cross)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Build release (aarch64 musl cross)
        # cross 容器内 glibc 较老（< 2.30），stable Rust（1.87+）编出的 build script
        # 需要 GLIBC_2.30+ 而跑不起来；此步固定用 Rust 1.85（产物兼容老 glibc）
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup target add aarch64-unknown-linux-musl --toolchain 1.85
          cargo +1.85 install cross --locked
          rustup override set 1.85
          cross build --release --target aarch64-unknown-linux-musl
          rustup override unset
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synaptic-linux-binaries
          path: |
            target/release/synaptic
            target/aarch64-unknown-linux-gnu/release/synaptic
            target/aarch64-unknown-linux-musl/release/synaptic
          retention-days: 30
