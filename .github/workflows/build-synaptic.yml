name: build-synaptic
# CI 构建 Synaptic 二进制（x86_64 + aarch64 交叉编译）。
#   始终：上传 artifact（30 天）
#   手动触发且填了 release_tag 时：编译完**直接创建 Release 并上传资产** —— 全程在 CI 内网完成，
#   不经任何人的上行带宽（比"下载 artifact 再手动 gh release create"快且可复现）。
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-synaptic.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '填了 → 编译后创建该 tag 的 Release 并上传资产（例 synaptic-v1.2.2）；留空 → 只产 artifact'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: synaptic-graph/synaptic
          ref: master
      - name: Read version
        id: ver
        run: |
          V="$(sed -nE 's/^version *= *"(.*)"/\1/p' Cargo.toml | head -1)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "synaptic version: ${V:-unknown}"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add targets + linker
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build release (x86_64)
        run: cargo build --release
      - name: Build release (aarch64 cross)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Build release (aarch64 musl cross)
        # cross 默认镜像的 glibc 太老，现代 Rust 的 build script 跑不起来
        # （要 GLIBC_2.28+）。用 :main 标签的新镜像（Ubuntu 基座更新）。
        env:
          CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
        run: |
          cargo install cross --locked
          cross build --release --target aarch64-unknown-linux-musl
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synaptic-linux-binaries
          path: |
            target/release/synaptic
            target/aarch64-unknown-linux-gnu/release/synaptic
            target/aarch64-unknown-linux-musl/release/synaptic
          retention-days: 30

  release:
    needs: build-linux
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: synaptic-linux-binaries
          path: art
      - name: Prepare assets
        run: |
          set -euo pipefail
          VER="${{ needs.build-linux.outputs.version }}"
          [ -n "$VER" ] || VER=unknown
          mkdir -p rel
          cp art/release/synaptic                             "rel/synaptic-${VER}-x86_64-unknown-linux-gnu"
          cp art/aarch64-unknown-linux-musl/release/synaptic   "rel/synaptic-${VER}-aarch64-unknown-linux-musl"
          cp art/aarch64-unknown-linux-gnu/release/synaptic    "rel/synaptic-${VER}-aarch64-unknown-linux-gnu"
          chmod +x rel/*
          ls -lh rel/
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" rel/* \
            --repo "${{ github.repository }}" \
            --title "Synaptic ${VER} (Linux binaries)" \
            --notes-file .github/synaptic-release-notes.md
