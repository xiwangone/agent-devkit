name: build-synaptic
# CI 构建 Synaptic 二进制（x86_64 + aarch64 交叉编译，产物上传 artifact）
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-synaptic.yml'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: synaptic-graph/synaptic
          ref: master
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add targets + linker
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build release (x86_64)
        run: cargo build --release
      - name: Build release (aarch64 cross)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Build release (aarch64 musl cross)
        # cross 默认镜像的 glibc 太老，现代 Rust 的 build script 跑不起来
        # （要 GLIBC_2.28+）。用 :main 标签的新镜像（Ubuntu 基座更新）。
        env:
          CROSS_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_IMAGE: ghcr.io/cross-rs/aarch64-unknown-linux-musl:main
        run: |
          cargo install cross --locked
          cross build --release --target aarch64-unknown-linux-musl
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synaptic-linux-binaries
          path: |
            target/release/synaptic
            target/aarch64-unknown-linux-gnu/release/synaptic
            target/aarch64-unknown-linux-musl/release/synaptic
          retention-days: 30
