name: build-synaptic
# CI 构建 Synaptic 二进制（x86_64 + aarch64 交叉编译，仅手动触发，产物上传 artifact）
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ColinVaughn/Synaptic
          ref: master
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add targets + linker
        run: |
          rustup target add aarch64-unknown-linux-gnu
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build release (x86_64)
        run: cargo build --release
      - name: Build release (aarch64 cross)
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --target aarch64-unknown-linux-gnu
      - name: Build release (aarch64 musl cross)
        run: |
          # 交叉 C 工具链：musl.cc 原站 + more.musl.cc 镜像多源尝试（原站曾超时）
          for url in https://more.musl.cc/aarch64-linux-musl-cross.tgz https://musl.cc/aarch64-linux-musl-cross.tgz; do
            echo "try: $url"
            curl -sL --connect-timeout 15 --max-time 150 "$url" -o /tmp/musl-cross.tgz && tar tzf /tmp/musl-cross.tgz >/dev/null 2>&1 && break
          done
          tar xzf /tmp/musl-cross.tgz -C /opt
          ls /opt/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc  # 验证工具链就位
          export PATH="/opt/aarch64-linux-musl-cross/bin:$PATH"
          export CC_aarch64_unknown_linux_musl=aarch64-linux-musl-gcc
          export AR_aarch64_unknown_linux_musl=aarch64-linux-musl-ar
          cargo build --release --target aarch64-unknown-linux-musl
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synaptic-linux-binaries
          path: |
            target/release/synaptic
            target/aarch64-unknown-linux-gnu/release/synaptic
            target/aarch64-unknown-linux-musl/release/synaptic
          retention-days: 30
